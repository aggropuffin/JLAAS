enabled: true

giteaRootURL: "http://gitea-http.gitea.svc.cluster.local:3000"

existingSecret: "gitea-actions-token"
existingSecretKey: "token"

serviceAccount:
  create: false
  name: buildah-sa

statefulset:
  replicas: 1

  builder:
    type: buildah

  actRunner:
    repository: montmorancy/jlaas_buildah
    tag: "v1.41.5_latest"
    pullPolicy: Always

    # This goes to the ConfigMap only
    config: |
      log:
        level: debug
      cache:
        enabled: false
      container:
        require_docker: false
        docker_timeout: 300s
      runner:
        name: "buildah-runner"
        capacity: 1
        labels: ["buildah", "rootless"]

  # Buildah runtime env (OpenShift restricted-v2 safe)
  extraEnvs:
    - name: HOME
      value: "/data"
    - name: STORAGE_DRIVER
      value: "vfs"
    - name: BUILDAH_ISOLATION
      value: "chroot"
    - name: BUILDAH_FORMAT
      value: "docker"
    - name: BUILDAH_RUNTIME
      value: "runc"

  
  # Where the runner stores .runner (registration file)
  workDir: "/data"

  # Auto-registration controls (like old chart)
  register:
    enabled: true
    name: "buildah-runner"
    labels: "buildah,rootless"

  # Data volume for /data (where .runner lives)
  dataVolume:
    type: "emptyDir"        # "emptyDir" | "pvc"
    pvc:
      enabled: false        # set true to persist across pod reschedules
      storageClass: ""      # e.g. "managed-csi"
      size: "1Gi"

init:
  image:
    repository: busybox
    tag: "1.37.0"

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault


podSecurityContext:
  runAsGroup: 1000
  fsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # Buildah needs to write
  capabilities:
    drop: ["ALL"]
global:
  imageRegistry: ""
  storageClass: ""
