{{- if .Values.enabled }}
{{- $fullname := include "gitea.actions.fullname" . -}}
{{- $useBuildah := eq .Values.statefulset.builder.type "buildah" -}}
{{- $workDir := default "/data" .Values.statefulset.workDir -}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fullname }}-act-runner
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "gitea.actions.labels" . | nindent 4 }}
spec:
  serviceName: {{ $fullname }}-act-runner
  replicas: {{ .Values.statefulset.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "gitea.actions.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitea.actions.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- if and .Values.statefulset.register.enabled }}
      initContainers:
        - name: register-runner
          image: "{{ .Values.statefulset.actRunner.repository }}:{{ .Values.statefulset.actRunner.tag }}"
          imagePullPolicy: {{ .Values.statefulset.actRunner.pullPolicy }}
          workingDir: {{ $workDir }}
          command: ["/usr/local/bin/act_runner"]
          args:
            - "register"
            - "--instance"
            - "{{ .Values.giteaRootURL }}"
            - "--token"
            - "$(GITEA_RUNNER_REGISTRATION_TOKEN)"
            - "--name"
            - "{{ .Values.statefulset.register.name }}"
            - "--labels"
            - "{{ .Values.statefulset.register.labels }}"
          env:
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.existingSecretKey }}
          volumeMounts:
            - name: runner-data
              mountPath: {{ $workDir }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- end }}

      containers:
        - name: act-runner
          image: "{{ .Values.statefulset.actRunner.repository }}:{{ .Values.statefulset.actRunner.tag }}"
          imagePullPolicy: {{ .Values.statefulset.actRunner.pullPolicy }}
          workingDir: {{ $workDir }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "[INFO] Forcing Buildah 'chroot' isolation in user config"
              # Create the override config file before act_runner starts
              mkdir -p /data/.config/containers
              cat <<EOF > /data/.config/containers/containers.conf
              [containers]
              isolation = "chroot"
              EOF
              
              echo "[INFO] Starting Gitea Actions Runner (Buildah mode)";
              exec /usr/local/bin/act_runner daemon --config /etc/act-runner/config.yaml
          env:
            - name: GITEA_INSTANCE_URL
              value: "{{ .Values.giteaRootURL }}"
            - name: GITEA_RUNNER_NAME
              value: "{{ .Values.statefulset.register.name }}"
            - name: GITEA_RUNNER_LABELS
              value: "{{ .Values.statefulset.register.labels }}"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.existingSecretKey }}
            {{- range .Values.statefulset.extraEnvs }}
            - name: {{ .name }}
              value: "{{ .value }}"
            {{- end }}

          volumeMounts:
            - name: runner-config
              mountPath: /etc/act-runner
            - name: runner-data
              mountPath: {{ $workDir }}
            - name: tmp
              mountPath: /tmp
              {{- if $useBuildah }}
            - name: buildah-storage
              mountPath: /var/lib/containers
            {{- end }}

          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}

      volumes:
        - name: runner-config
          configMap:
            name: {{ $fullname }}-act-runner-config

        # /data (or custom workDir) holds the .runner file
        - name: runner-data
          {{- if and .Values.statefulset.dataVolume (eq .Values.statefulset.dataVolume.type "pvc") .Values.statefulset.dataVolume.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ $fullname }}-runner-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}

        {{- if $useBuildah }}
        - name: buildah-storage
          emptyDir: {}
        {{- end }}
{{- end }}
