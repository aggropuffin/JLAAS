postgresql:
  enabled: false
postgresql-ha:
  enabled: false

valkey-cluster:
  enabled: false
valkey:
  enabled: false
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: "8.1.3"
  master:
    persistence:
      enabled: true

persistence:
  enabled: true

global:
  security:
    allowInsecureImages: true

# Optional metadata only; not consumed by the chart unless we change templates.
externalPostgres:
  serviceHost: "default-rw"
  servicePort: 5432
  dbName: "gitea"
  dbUser: "gitea"
  dbPassword: ""
  sslMode: "disable"

# Make SCC happy: override the chart’s default fsGroup:1000
podSecurityContext:
  fsGroup: null
  fsGroupChangePolicy: "OnRootMismatch"
  supplementalGroups: []

containerSecurityContext:
  runAsNonRoot: true
  runAsUser: null
  runAsGroup: null
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
  seLinuxOptions: null

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

gitea:
  admin:
    username: gitea_admin
    password: "r8sA8CPHD9!bt6d"
    email: "gitea@local.domain"
    passwordMode: keepUpdated

  config:
    server:
      PROTOCOL: http
      DOMAIN: gitea.apps-crc.testing
      ROOT_URL: "http://gitea.apps-crc.testing"
      HTTP_PORT: 3000
      SSH_PORT: 22

    # IMPORTANT: use literals here (no {{ }})
    database:
      DB_TYPE: postgres
      HOST: "default-rw:5432"   # literal — not templated
      NAME: "app"
      USER: "app"
      PASSWD: "0VSf8VfWks3GwQGgJBTFtk3wPpAYDMnTarx9mdCsLFV8XVtEE4UWRKo92QCgvI5W"                # set via --set-string at install/upgrade
      SSL_MODE: "disable"

    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: true
    actions:
      enabled: true

# If you want Route via extraDeploy (works for you), keep it:
extraDeploy:
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: gitea
      namespace: gitea
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: gitea
    spec:
      host: gitea.apps-crc.testing
      to:
        kind: Service
        name: "{{ .Release.Name }}-http"
        weight: 100
      port:
        targetPort: http
      wildcardPolicy: None
