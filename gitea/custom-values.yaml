postgresql:
  enabled: false
postgresql-ha:
  enabled: false

valkey-cluster:
  enabled: false
valkey:
  enabled: true
  image:
    registry: docker.io
    repository: valkey/valkey
    tag: "8.1.3"
  master:
    persistence:
      enabled: true

persistence:
  enabled: true

global:
  security:
    allowInsecureImages: true

# CNPG cluster 'default' => use default-rw (adjust if you rename later)
externalPostgres:
  serviceHost: "default-rw"
  servicePort: 5432
  dbName: "gitea"
  dbUser: "gitea"
  dbPassword: ""          # pass via --set-string at install/upgrade
  sslMode: "disable"

podSecurityContext:
  fsGroup: null
containerSecurityContext:
  runAsNonRoot: true
  runAsUser: null
  runAsGroup: null
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault
  seLinuxOptions: null

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

gitea:
  admin:
    username: gitea_admin
    password: "r8sA8CPHD9!bt6d"
    email: "gitea@local.domain"
    passwordMode: keepUpdated
  config:
    server:
      PROTOCOL: http
      DOMAIN: gitea.apps-crc.testing
      ROOT_URL: "http://gitea.apps-crc.testing"
      HTTP_PORT: 3000
      SSH_PORT: 22
    database:
      DB_TYPE: postgres
      HOST: "{{ .Values.externalPostgres.serviceHost }}:{{ .Values.externalPostgres.servicePort }}"
      NAME: "{{ .Values.externalPostgres.dbName }}"
      USER: "{{ .Values.externalPostgres.dbUser }}"
      PASSWD: "{{ .Values.externalPostgres.dbPassword }}"
      SSL_MODE: "{{ .Values.externalPostgres.sslMode }}"
    indexer:
      ISSUE_INDEXER_TYPE: bleve
      REPO_INDEXER_ENABLED: true
    actions:
      enabled: true

extraDeploy:
  - apiVersion: route.openshift.io/v1
    kind: Route
    metadata:
      name: gitea
      namespace: gitea
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: gitea
    spec:
      host: gitea.apps-crc.testing
      to:
        kind: Service
        name: "{{ .Release.Name }}-http"
        weight: 100
      port:
        targetPort: http
      wildcardPolicy: None
